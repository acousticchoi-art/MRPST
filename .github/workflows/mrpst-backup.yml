name: MRPST backup script validation
on:
  pull_request:
    paths:
      - '.github/workflows/mrpst-backup.yml'
      - 'scripts/mrpst-backup*.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check archived backup script syntax
        run: |
          bash -n scripts/mrpst-backup.sh
          bash -n scripts/mrpst-backup-upload.sh
